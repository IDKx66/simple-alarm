plugins { id 'com.android.application' }

android {
    namespace 'com.example.simplealarm'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.simplealarm'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '1.7'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
